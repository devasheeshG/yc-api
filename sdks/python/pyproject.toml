[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yc-api"
version = "1.0.0"
description = "Typed Python client for the unofficial Y Combinator companies API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Devasheesh Mishra" }]
keywords = ["yc", "ycombinator", "api", "startups"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://devasheeshg.github.io/yc-api"
Repository = "https://github.com/devasheeshG/yc-api"
