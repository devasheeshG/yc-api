<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YC API</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --line: #dbe2f1;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 5% 5%, #dff5f1 0%, transparent 35%),
          radial-gradient(circle at 90% 10%, #e4ecff 0%, transparent 40%),
          var(--bg);
      }

      .container {
        max-width: 980px;
        margin: 40px auto;
        padding: 0 16px;
      }

      .hero,
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      }

      .hero {
        padding: 24px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .summary {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 10px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #f8fafc;
      }

      .pill .label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .pill .value {
        font-weight: 700;
        font-size: 1.1rem;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .card {
        padding: 18px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.15rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      th,
      td {
        text-align: left;
        border-bottom: 1px solid var(--line);
        padding: 8px 0;
      }

      th {
        color: #1f2937;
      }

      td {
        color: #334155;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .links {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .error {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid #fecaca;
        border-radius: 10px;
        background: #fff1f2;
        color: #9f1239;
      }

      @media (max-width: 780px) {
        .summary {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <h1>Y Combinator Companies API</h1>
        <p>Unofficial API generated from the YC company directory.</p>
        <div id="summary" class="summary" aria-live="polite"></div>
        <div class="links">
          <a href="./meta.json">meta.json</a>
          <a href="./README.md">README.md</a>
          <a href="https://github.com/devasheeshG/yc-api">GitHub repository</a>
        </div>
        <div id="error" class="error" style="display: none"></div>
      </section>

      <section class="grid">
        <article class="card">
          <h2>Companies</h2>
          <div id="companies"></div>
        </article>
        <article class="card">
          <h2>Batches</h2>
          <div id="batches"></div>
        </article>
        <article class="card">
          <h2>Industries</h2>
          <div id="industries"></div>
        </article>
        <article class="card">
          <h2>Tags</h2>
          <div id="tags"></div>
        </article>
      </section>
    </main>

    <script>
      const withFallback = (value, fallback = "-") => {
        return value === null || value === undefined || value === "" ? fallback : value;
      };

      const toRows = (obj) => {
        if (!obj || typeof obj !== "object") return [];
        return Object.entries(obj)
          .map(([, data]) => data)
          .sort((a, b) => a.name.localeCompare(b.name));
      };

      const renderTable = (rows) => {
        if (!rows.length) {
          return "<p>No data available yet.</p>";
        }

        const body = rows
          .map((row) => {
            return `<tr>
              <td>${withFallback(row.name)}</td>
              <td>${withFallback(row.count, 0)}</td>
              <td><a href="${row.api}">endpoint</a></td>
            </tr>`;
          })
          .join("");

        return `<table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Count</th>
              <th>API</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>`;
      };

      const renderSummary = (meta) => {
        const fields = [
          ["Last updated", withFallback(meta.last_updated)],
          ["Companies", toRows(meta.companies).length],
          ["Batches", toRows(meta.batches).length],
          ["Industries", toRows(meta.industries).length],
          ["Tags", toRows(meta.tags).length],
        ];

        return fields
          .map(
            ([label, value]) => `<div class="pill"><span class="label">${label}</span><span class="value">${value}</span></div>`,
          )
          .join("");
      };

      const showError = (message) => {
        const el = document.getElementById("error");
        el.textContent = message;
        el.style.display = "block";
      };

      const loadMeta = async () => {
        try {
          const response = await fetch("./meta.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Could not load meta.json (HTTP ${response.status})`);
          }

          const meta = await response.json();

          document.getElementById("summary").innerHTML = renderSummary(meta);
          document.getElementById("companies").innerHTML = renderTable(toRows(meta.companies));
          document.getElementById("batches").innerHTML = renderTable(toRows(meta.batches));
          document.getElementById("industries").innerHTML = renderTable(toRows(meta.industries));
          document.getElementById("tags").innerHTML = renderTable(toRows(meta.tags));
        } catch (error) {
          showError(
            `Page is live, but metadata is missing. Run the workflow once from Actions. Details: ${error.message}`,
          );
        }
      };

      loadMeta();
    </script>
  </body>
</html>
